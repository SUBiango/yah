# Netlify config for the BLOG site (its own Netlify site).
# When creating the site, set Base directory = "blog"; Netlify then reads this file.
[build]
  command = "npm run build"
  publish = "dist"
  # Only rebuild when files under blog/ change (main-site-only commits skip a build).
  # `git diff --quiet` exits 0 (→ cancel build) when there are no blog/ changes.
  ignore = "git diff --quiet HEAD^ HEAD -- ."

[build.environment]
  NODE_VERSION = "18"

# The blog is built with Astro `base: '/blog'`, so pages reference assets at
# /blog/... but the files are published at the site root. In production this is
# resolved by the main site's proxy (www.yahsl.org/blog/* → this site's root).
# This rewrite makes the raw origin (yah-blog.netlify.app/blog/...) render too,
# which is handy for previewing the blog directly. It does NOT affect the proxy,
# whose requests arrive here already stripped of the /blog prefix.
# SEO is unaffected: every page's <link rel="canonical"> points to www.yahsl.org/blog.
[[redirects]]
  from = "/blog/*"
  to = "/:splat"
  status = 200
