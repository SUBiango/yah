<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager · YAH Blog</title>
    <!-- Absolute config path: without this, Decap fetches config.yml relative
         to the current URL, which resolves to the wrong path (/blog/config.yml)
         when this page is loaded without a trailing slash (/blog/admin). -->
    <link href="/blog/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <!-- Netlify Identity widget: handles login for Git Gateway -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      // Identity + Git Gateway are enabled on the yah-blog Netlify site, not
      // this main site that /blog is proxied from. The widget defaults to
      // calling /.netlify/identity on the page's own origin (www.yahsl.org),
      // which 404s since that site has no Identity service — Netlify also
      // won't let a redirect proxy anything under the reserved /.netlify/*
      // path, so this explicit APIUrl is the only way to point it correctly.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.init({
          APIUrl: 'https://yah-blog.netlify.app/.netlify/identity',
        });
      }
    </script>
  </head>
  <body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
    <script>
      // If a writer opens the invite/recovery link from the main site, redirect
      // them into the CMS on the same (main) domain so Identity callbacks resolve.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/blog/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
