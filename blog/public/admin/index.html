<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager · YAH Blog</title>
    <!-- Absolute config path: without this, Decap fetches config.yml relative
         to the current URL, which resolves to the wrong path (/blog/config.yml)
         when this page is loaded without a trailing slash (/blog/admin). -->
    <link href="/blog/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <!-- Netlify Identity widget: handles login for Git Gateway -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
    <script>
      // Identity + Git Gateway are enabled on the yah-blog Netlify site, not
      // this main site that /blog is proxied from. The widget script itself
      // unconditionally auto-calls init() with NO arguments (same-origin) on
      // DOMContentLoaded, regardless of any init() call made earlier — so a
      // custom-APIUrl init() in <head>, or before this script tag, just gets
      // silently overwritten. Registering our own DOMContentLoaded listener
      // here (after the widget's script tag, so ours runs after its built-in
      // listener) makes our call the final, authoritative one.
      document.addEventListener('DOMContentLoaded', function () {
        if (window.netlifyIdentity) {
          window.netlifyIdentity.init({
            APIUrl: 'https://yah-blog.netlify.app/.netlify/identity',
          });
        }
      });

      // If a writer opens the invite/recovery link from the main site, redirect
      // them into the CMS on the same (main) domain so Identity callbacks resolve.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/blog/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
