# MAIN SITE Netlify config.
# The ONLY change to the existing site for the blog feature: a proxy that serves
# the separate blog Netlify site under /blog on the main domain. No [build]
# section here, so the main site's existing build/publish settings are unchanged.
#
# Astro's `base: '/blog'` rewrites link/asset URLs to /blog/... but does NOT nest
# the physical output under dist/blog/ — the blog site serves its files at the
# root (/index.html, /_astro/..., /rss.xml). So the proxy strips the /blog prefix:
# www.yahsl.org/blog/rss.xml  ->  yah-blog.netlify.app/rss.xml.
[[redirects]]
  from = "/blog/*"
  to = "https://yah-blog.netlify.app/:splat"
  status = 200
  force = true

# The local Kantan page was removed; Kantan now lives at its own site.
# 301 the old URL so existing links/bookmarks/search results don't 404.
[[redirects]]
  from = "/projects/kantan.html"
  to = "https://getkantan.netlify.app/"
  status = 301
  force = true
